# Multi-Provider Configuration
# All LLM, embedding, and reranker models configured here
# Supports: OpenAI, Anthropic, Google, Cohere, Ollama, HuggingFace

# Default provider for each capability
defaults:
  llm: openai-gpt4o-mini
  embedding: openai-text-embedding-3-small
  reranker: cohere-rerank-v3

# LLM Providers
llm:
  openai-gpt4o-mini:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.1
    maxTokens: 4096
    apiKeyEnv: OPENAI_API_KEY
  
  openai-gpt4o:
    provider: openai
    model: gpt-4o
    temperature: 0.1
    maxTokens: 4096
    apiKeyEnv: OPENAI_API_KEY
  
  anthropic-claude-3-5-sonnet:
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    temperature: 0.1
    maxTokens: 4096
    apiKeyEnv: ANTHROPIC_API_KEY
  
  anthropic-claude-3-haiku:
    provider: anthropic
    model: claude-3-haiku-20240307
    temperature: 0.1
    maxTokens: 4096
    apiKeyEnv: ANTHROPIC_API_KEY
  
  ollama-llama3:
    provider: ollama
    model: llama3
    temperature: 0.1
    maxTokens: 4096
    baseUrl: http://localhost:11434
  
  huggingface-mistral:
    provider: huggingface
    model: mistralai/Mistral-7B-Instruct-v0.3
    temperature: 0.1
    maxTokens: 4096
    apiKeyEnv: HUGGINGFACE_API_KEY
  
  google-gemini-1.5-pro:
    provider: google
    model: gemini-1.5-pro
    temperature: 0.1
    maxTokens: 8192
    apiKeyEnv: GOOGLE_API_KEY
  
  google-gemini-1.5-flash:
    provider: google
    model: gemini-1.5-flash
    temperature: 0.1
    maxTokens: 8192
    apiKeyEnv: GOOGLE_API_KEY
  
  google-gemini-1.0-pro:
    provider: google
    model: gemini-1.0-pro
    temperature: 0.1
    maxTokens: 30720
    apiKeyEnv: GOOGLE_API_KEY

# Embedding Providers
embedding:
  openai-text-embedding-3-small:
    provider: openai
    model: text-embedding-3-small
    dimensions: 1536
    apiKeyEnv: OPENAI_API_KEY
  
  openai-text-embedding-3-large:
    provider: openai
    model: text-embedding-3-large
    dimensions: 3072
    apiKeyEnv: OPENAI_API_KEY
  
  cohere-embed-v3:
    provider: cohere
    model: embed-english-v3.0
    dimensions: 1024
    apiKeyEnv: COHERE_API_KEY
  
  ollama-nomic-embed:
    provider: ollama
    model: nomic-embed-text
    dimensions: 768
    baseUrl: http://localhost:11434
  
  google-embedding-001:
    provider: google
    model: text-embedding-004
    dimensions: 768
    apiKeyEnv: GOOGLE_API_KEY

# Reranker Providers
reranker:
  cohere-rerank-v3:
    provider: cohere
    model: rerank-v3.5
    topN: 10
    apiKeyEnv: COHERE_API_KEY
  
  cohere-rerank-multilingual:
    provider: cohere
    model: rerank-multilingual-v3.0
    topN: 10
    apiKeyEnv: COHERE_API_KEY

# Ingestion Configuration
ingestion:
  chunking:
    chunkSize: 1000
    chunkOverlap: 200

# RAG Pipeline Step Configuration
rag:
  queryRewrite:
    llm: openai-gpt4o-mini
    temperature: 0.0
    maxTokens: 512
    prompt: |
      Fix grammar and clarify the user's question while preserving intent.
      User question: {query}
      Rewritten question:
  
  stepBack:
    llm: openai-gpt4o-mini
    temperature: 0.3
    maxTokens: 512
    prompt: |
      Generate a broader, higher-level question that encompasses the user's query.
      This helps retrieve more general context.
      User query: {query}
      Step-back question:
  
  subQueryDecomposition:
    llm: openai-gpt4o-mini
    temperature: 0.3
    maxTokens: 1024
    prompt: |
      Break the user's question into 2-4 simpler sub-questions that can be answered independently.
      Return as JSON array of strings.
      User question: {query}
      Sub-questions:
  
  hyde:
    llm: openai-gpt4o-mini
    temperature: 0.7
    maxTokens: 1024
    prompt: |
      Generate a hypothetical document that would answer the user's question.
      This document will be embedded and used for retrieval.
      Question: {query}
      Hypothetical answer:
  
  retrieval:
    k: 50
    scoreThreshold: 0.5
  
  rrf:
    k: 60
  
  rerank:
    reranker: cohere-rerank-v3
    topN: 10
  
  generation:
    llm: openai-gpt4o-mini
    temperature: 0.1
    maxTokens: 2048
    prompt: |
      You are a research assistant. Answer the user's question using ONLY the provided context.
      
      CRITICAL RULES:
      1. Every claim MUST be cited with [source_id] inline
      2. If context is insufficient, say "I don't have enough information from the provided sources"
      3. Use precise citations: PDF page numbers, YouTube timestamps, character ranges
      4. Never hallucinate or use external knowledge
      
      Context:
      {context}
      
      Question: {query}
      
      Answer with inline citations: